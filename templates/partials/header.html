<header class="site-header">
    <div class="container site-header__inner">
        <a href="/" class="logo">
            <span class="logo__icon">🛒</span>
            <span class="logo__text">ОНЛАЙН-МАГАЗИН ПРОДУКТОВ</span>
        </a>

        <form class="search" action="/products/" method="get">
            <input type="text" name="search" placeholder="Искать товары">
            <button type="submit">🔍</button>
        </form>

        {% if user.is_authenticated %}
            <a href="/accounts/profile/" class="btn btn--primary">
                👤 {{ user.username }}
            </a>
        {% else %}
            <a href="{% url 'users:login' %}" class="btn btn--outline">Вход</a>
        {% endif %}
    </div>
</header>
