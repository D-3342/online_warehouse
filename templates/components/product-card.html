<div class="product-card">
    {% if product.image %}
        <img class="product-card__img" src="{{ product.image.url }}" alt="{{ product.name }}">
    {% else %}
        <img class="product-card__img" src="/media/products/default.jpg" alt="{{ product.name }}">
    {% endif %}

    <h3 class="product-card__title">{{ product.name }}</h3>
    <p class="product-card__price">{{ product.price }} ₽</p>
    <p class="product-card__desc">{{ product.description }}</p>

    <form method="post" action="{% url 'cart:add_to_cart' product.id %}" class="cart-form">
        {% csrf_token %}
        <div class="qty">
            <button type="button" class="qty-minus">−</button>
            <input type="number" name="qty" value="1" min="1" max="{{ product.quantity }}" class="qty-input">
            <button type="button" class="qty-plus">+</button>
        </div>
        <button class="btn btn--cart" type="submit">В корзину</button>
    </form>
</div>
